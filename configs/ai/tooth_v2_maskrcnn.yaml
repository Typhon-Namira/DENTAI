schema_version: tooth-training-2.0
task: tooth_instance_segmentation
capability_state: RESEARCH_DATASET_READY
model_lifecycle: RESEARCH_ONLY
clinical_review_state: NOT_REVIEWED
model:
  architecture: maskrcnn_resnet50_fpn_v2
  library: torchvision
  code_license: BSD-3-Clause
  pretrained_backbone: ImageNet1K_V2
  num_classes: 2
data:
  dataset_ids: [dentex_hf_7b27ccc8, akudental_git_92e2cc3]
  split_manifest: data/splits/tooth_v2
  minimum_annotated_training_cases: 200
  input_size: [1024, 512]
  channels: 3
  normalization: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  patient_independence: PATIENT_INDEPENDENCE_UNVERIFIED
  license_inheritance: RESEARCH_ONLY
augmentation:
  policy: opg_safe_v2
  horizontal_flip_probability: 0.0
  brightness_range: [0.92, 1.08]
  contrast_range: [0.90, 1.10]
  gamma_range: [0.92, 1.08]
  gaussian_noise_probability: 0.2
  gaussian_noise_std_max: 0.008
  mild_blur_probability: 0.1
  prohibited: [horizontal_flip_without_fdi_remap, vertical_flip, elastic_deformation, large_rotation, anatomy_cutout]
hard_case_sampling:
  enabled_after_teacher_mining: true
  normal_weight: 1.0
  moderate_weight: 1.5
  severe_weight: 2.25
  per_bucket_probability_cap: 0.25
optimizer: {name: AdamW, learning_rate: 0.0001, weight_decay: 0.0001}
scheduler: {name: ReduceLROnPlateau, mode: max, factor: 0.5, patience: 4}
training:
  epochs: 60
  batch_size: 2
  gradient_accumulation: 4
  early_stopping_patience: 12
  checkpoint_every_epochs: 1
  validation_every_epochs: 1
  seed: 47
  mixed_precision: bf16-mixed
  data_loader_workers: 4
  deterministic: true
  resume: auto
losses: {classification: cross_entropy, box_regression: smooth_l1, mask: binary_cross_entropy}
evaluation:
  locked_test_use: final_only
  detection: [precision, recall, map_50, map_50_95, false_positives_per_image, missed_teeth_per_image]
  segmentation: [mask_ap, dice, iou, per_instance_dice, per_instance_iou]
  subsets: [anterior, posterior, third_molar, impacted, restoration_heavy, low_quality, hard_case]
checkpointing:
  directory: checkpoints/tooth_v2/maskrcnn
  save_latest: true
  save_best: true
  monitor: validation_map_50_95
  include_optimizer: true
  include_scheduler: true
  include_rng_state: true

schema_version: tooth-training-1.0
task: tooth_instance_segmentation
capability_state: RESEARCH_DATASET_READY
model_lifecycle: RESEARCH_ONLY
clinical_review_state: NOT_REVIEWED
model:
  architecture: maskrcnn_resnet50_fpn_v2
  library: torchvision
  code_license: BSD-3-Clause
  pretrained_backbone: ImageNet1K_V2
  weight_license: BSD-3-Clause
  weight_training_dataset: ImageNet-1K
  num_classes: 2
  fallback:
    architecture: unetplusplus
    library: MONAI
    limitation: semantic segmentation only; requires validated instance postprocessing
data:
  dataset_ids: [dentex_hf_7b27ccc8, akudental_git_92e2cc3, panoramic_dental_xray_73n3kz2k4k_v3]
  primary_instance_dataset: dentex_hf_7b27ccc8
  primary_canonical_annotations: data/canonical/dentex/hf-7b27ccc8/instances.json
  primary_image_dir: data/raw/dentex/hf-7b27ccc8/extracted/training_data
  split_manifest: data/splits/dentex_hf_7b27ccc8/hf-7b27ccc8/split.json
  auxiliary_instance_datasets: [akudental_git_92e2cc3, panoramic_dental_xray_73n3kz2k4k_v3]
  semantic_pretraining_datasets: [sts_2d_tooth_hf_a6bf5e99, tooth_segmentation_jrz4nj82zv_v1]
  patient_independence: PATIENT_INDEPENDENCE_UNVERIFIED
  license_inheritance: RESEARCH_ONLY
  minimum_annotated_training_cases: 200
  input_size: [1024, 512]
  channels: 3
  normalization: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
augmentation:
  horizontal_flip_probability: 0.0
  rotation_degrees: 3.0
  translate_fraction: 0.02
  scale_range: [0.97, 1.03]
  brightness_limit: 0.08
  contrast_limit: 0.08
  gamma_range: [0.95, 1.05]
  gaussian_noise_std_max: 0.01
  prohibited: [vertical_flip, elastic_deformation, large_rotation, anatomy_cutout]
optimizer: {name: AdamW, learning_rate: 0.0001, weight_decay: 0.0001}
scheduler: {name: ReduceLROnPlateau, mode: max, factor: 0.5, patience: 5}
training:
  epochs: 100
  batch_size: 2
  gradient_accumulation: 4
  early_stopping_patience: 15
  checkpoint_every_epochs: 1
  validation_every_epochs: 1
  seed: 47
  mixed_precision: bf16-mixed
  data_loader_workers: 4
  deterministic: true
  resume: auto
losses: {classification: cross_entropy, box_regression: smooth_l1, mask: binary_cross_entropy}
evaluation:
  locked_test_use: final_only
  detection: [precision, recall, f1, map_50, map_50_95, false_positives_per_image]
  segmentation: [dice, iou, per_instance_dice, per_instance_iou]
  bootstrap: {unit: case, resamples: 2000, confidence_level: 0.95, seed: 47}
  calibration: [reliability_diagram, expected_calibration_error, brier_score, temperature_scaling]
checkpointing:
  directory: checkpoints/tooth_v1
  save_latest: true
  save_best: true
  monitor: validation_map_50_95
  include_optimizer: true
  include_scheduler: true
  include_rng_state: true

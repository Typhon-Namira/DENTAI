services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      control-db: {condition: service_healthy}
      clinic-a-db: {condition: service_healthy}
      clinic-b-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  control-db:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: platform_control_db}
    volumes: [control-data:/var/lib/postgresql/data]
    healthcheck: &postgres-health
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  clinic-a-db:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: marstom_clinic_db}
    volumes: [clinic-a-data:/var/lib/postgresql/data]
    healthcheck: *postgres-health
  clinic-b-db:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: demo_dental_clinic_db}
    volumes: [clinic-b-data:/var/lib/postgresql/data]
    healthcheck: *postgres-health
volumes: {control-data: {}, clinic-a-data: {}, clinic-b-data: {}}

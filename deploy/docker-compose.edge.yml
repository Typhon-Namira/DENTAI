services:
  caddy:
    image: caddy:2.8-alpine
    container_name: teta2-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - teta2-internal

networks:
  teta2-internal:
    external: true

volumes:
  caddy_data:
  caddy_config:

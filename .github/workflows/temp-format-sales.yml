name: Temporary sales formatter

on:
  push:
    branches:
      - sales-manager-platform-v1
    paths:
      - "app/database/control_models.py"
      - "app/platform/sales_manager_api.py"
      - "app/platform/sales_service.py"
      - "app/platform/api.py"
      - "app/platform/admin_payment_api.py"
      - "migrations/versions/0015_sales_manager_platform.py"
      - ".github/workflows/temp-format-sales.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sales-manager-platform-v1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format app/database/control_models.py app/platform/sales_manager_api.py app/platform/sales_service.py app/platform/api.py app/platform/admin_payment_api.py migrations/versions/0015_sales_manager_platform.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/database/control_models.py app/platform/sales_manager_api.py app/platform/sales_service.py app/platform/api.py app/platform/admin_payment_api.py migrations/versions/0015_sales_manager_platform.py
          git commit -m "style(sales): apply Ruff formatting"
          git push origin HEAD:sales-manager-platform-v1

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.3", enable-cache: true}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check .

  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.3", enable-cache: true}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy app

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.3", enable-cache: true}
      - run: uv sync --frozen --extra dev
      - run: uv run pytest --cov=app --cov-report=term-missing

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.3", enable-cache: true}
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/validate_ai_release.py --metadata-only

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.3", enable-cache: true}
      - run: uv sync --frozen --extra dev
      - run: uv run bandit -r app scripts -q
      - run: uv run pip-audit

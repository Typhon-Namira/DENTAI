name: Deploy Care API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing deployment secrets
        required: true
        default: production
        type: environment

concurrency:
  group: care-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check . && uv run ruff check . && uv run mypy app && uv run pytest
      - working-directory: frontend-test
        run: |
          npm ci --no-audit --no-fund
          npm test -- --run
          npm run build
          ! grep -R -E "https?://api-domain|your-dentai-production-domain\.example" dist
      - working-directory: whatsapp_service
        run: npm install --no-audit --no-fund && npm test
      - run: docker build -t dentai-care:${{ github.sha }} .

  deploy-ec2:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate protected deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_RELEASE_ROOT: ${{ secrets.EC2_RELEASE_ROOT }}
          CARE_BACKEND_URL: ${{ secrets.CARE_BACKEND_URL }}
          CARE_FRONTEND_URL: ${{ secrets.CARE_FRONTEND_URL }}
          CARE_SMOKE_CLINIC_SLUG: ${{ secrets.CARE_SMOKE_CLINIC_SLUG }}
          CARE_SMOKE_IDENTIFIER: ${{ secrets.CARE_SMOKE_IDENTIFIER }}
          CARE_SMOKE_PASSWORD: ${{ secrets.CARE_SMOKE_PASSWORD }}
        run: |
          missing=0
          for name in EC2_USER EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS CARE_SMOKE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing production secret::$name is not configured in the selected GitHub environment."
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload immutable release source
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '35.159.65.156' }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_ROOT: ${{ secrets.EC2_RELEASE_ROOT || '/tmp/dentai-releases' }}
        run: |
          tar -czf /tmp/release.tgz \
            Dockerfile .dockerignore pyproject.toml uv.lock alembic.ini README.md \
            app ai_engine configs config artifacts/production migrations docs/ai scripts \
            whatsapp_service frontend-test
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p '$RELEASE_ROOT/${{ github.sha }}'"
          scp /tmp/release.tgz "$EC2_USER@$EC2_HOST:$RELEASE_ROOT/${{ github.sha }}/release.tgz"
      - name: Build, migrate, switch, and verify
        id: deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '35.159.65.156' }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_ROOT: ${{ secrets.EC2_RELEASE_ROOT || '/tmp/dentai-releases' }}
          CARE_BACKEND_URL: ${{ secrets.CARE_BACKEND_URL || 'https://35-159-65-156.sslip.io' }}
          CARE_FRONTEND_URL: ${{ secrets.CARE_FRONTEND_URL || 'https://www.teta2.com' }}
          CARE_SMOKE_CLINIC_SLUG: ${{ secrets.CARE_SMOKE_CLINIC_SLUG || 'teta2-test' }}
          CARE_SMOKE_IDENTIFIER: ${{ secrets.CARE_SMOKE_IDENTIFIER || 'testdentist' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CARE_SMOKE_PASSWORD: ${{ secrets.CARE_SMOKE_PASSWORD }}
        run: |
          printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" | \
           ssh "$EC2_USER@$EC2_HOST" \
           "umask 077; cat > '$RELEASE_ROOT/${{ github.sha }}/groq.env'"
          ssh "$EC2_USER@$EC2_HOST" "RELEASE_ROOT='$RELEASE_ROOT' RELEASE_SHA='${{ github.sha }}' bash -s" <<'REMOTE'
          set -euo pipefail
          release="$RELEASE_ROOT/$RELEASE_SHA"

          # Failed deployments can leave partially extracted releases and Docker build cache behind.
          # Remove only abandoned release directories; successful releases with rollback metadata stay intact.
          for old_release in "$RELEASE_ROOT"/*; do
            [ -d "$old_release" ] || continue
            [ "$old_release" = "$release" ] && continue
            if [ ! -f "$old_release/previous-container" ]; then
              rm -rf "$old_release"
            fi
          done
          docker builder prune -af >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true

          tar -xzf "$release/release.tgz" -C "$release"
          docker inspect teta2-web >/dev/null
          docker network inspect teta2-internal >/dev/null
          docker inspect teta2-caddy >/dev/null
          mkdir -p "$release/predeploy"
          chmod 700 "$release/predeploy"
          docker inspect teta2-web > "$release/predeploy/teta2-web.inspect.json"
          docker inspect teta2-caddy > "$release/predeploy/teta2-caddy.inspect.json"
          docker network inspect teta2-internal > "$release/predeploy/teta2-internal.inspect.json"
          docker inspect -f '{{.Config.Image}}' teta2-web > "$release/predeploy/current-image"
          docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' teta2-web > "$release/predeploy/restart-policy"
          docker inspect -f '{{json .Config.Cmd}}' teta2-web > "$release/predeploy/command.json"
          docker inspect -f '{{json .Mounts}}' teta2-web > "$release/predeploy/mounts.json"
          docker inspect -f '{{json .NetworkSettings.Networks}}' teta2-web > "$release/predeploy/networks.json"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' teta2-web > "$release/runtime.env"
          chmod 600 "$release/runtime.env"
          sed -i '/^GROQ_API_KEY=/d' "$release/runtime.env"
          cat "$release/groq.env" >> "$release/runtime.env"
          rm -f "$release/groq.env"
          chmod 600 "$release/runtime.env"
          docker build -t "dentai-care:$RELEASE_SHA" "$release"
          docker run --rm --network teta2-internal --env-file "$release/runtime.env" \
            -e BACKUP_DESTINATION="/backups/pre-migration" \
            -v "$release:/backups" \
            "dentai-care:$RELEASE_SHA" python -m scripts.backup_all_tenants
          test -s "$release/pre-migration/manifest.json"
          docker run --rm --network teta2-internal --env-file "$release/runtime.env" \
            "dentai-care:$RELEASE_SHA" python -m scripts.migrate_all_tenants
          backup="teta2-web-previous-$RELEASE_SHA"
          docker rm -f "$backup" >/dev/null 2>&1 || true
          docker rm -f teta2-web-next >/dev/null 2>&1 || true
          docker run -d --name teta2-web-next --network teta2-internal --env-file "$release/runtime.env" -e WHATSAPP_EMBEDDED_SERVICE=false -e WHATSAPP_OUTREACH_WORKER_ENABLED=false -p 127.0.0.1:8001:8000 "dentai-care:$RELEASE_SHA"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:8001/ready
          docker rm -f teta2-web-next
          switched=0
          rollback_switch() {
            if [ "$switched" = 1 ]; then
              docker rm -f teta2-web >/dev/null 2>&1 || true
              docker rename "$backup" teta2-web
              docker start teta2-web
            fi
          }
          trap rollback_switch ERR
          docker stop teta2-web
          docker rename teta2-web "$backup"
          switched=1
          docker run -d --name teta2-web --restart unless-stopped --network teta2-internal --env-file "$release/runtime.env" --volumes-from "$backup" \
            -e WHATSAPP_EMBEDDED_SERVICE=true \
            -e WHATSAPP_OUTREACH_WORKER_ENABLED=true \
            "dentai-care:$RELEASE_SHA"
          wait_for_production() {
            for _ in $(seq 1 30); do
              if docker exec teta2-web python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=2)'; then
                return 0
              fi
              sleep 2
            done
            docker logs --tail 100 teta2-web >&2 || true
            return 1
          }
          wait_for_production
          docker exec teta2-web sh -c 'test "$WHATSAPP_EMBEDDED_SERVICE" = true && test "$WHATSAPP_OUTREACH_WORKER_ENABLED" = true'
          docker exec teta2-web python - <<'PY'
          from pathlib import Path
          import urllib.request

          commands = []
          for cmdline in Path("/proc").glob("[0-9]*/cmdline"):
              try:
                  command = cmdline.read_bytes().replace(b"\0", b" ").decode("utf-8", "ignore")
              except OSError:
                  continue
              commands.append(command)

          if not any("python -m app.outreach.worker" in command for command in commands):
              raise SystemExit("scheduled WhatsApp outreach worker process not found")
          if not any("node src/index.js" in command for command in commands):
              raise SystemExit("embedded WhatsApp service process not found")

          with urllib.request.urlopen("http://127.0.0.1:3001/health", timeout=3) as response:
              if response.status != 200:
                  raise SystemExit("embedded WhatsApp service health check failed")
          PY
          printf '%s' "$backup" > "$release/previous-container"
          trap - ERR
          REMOTE
          if ! CARE_BACKEND_URL="$CARE_BACKEND_URL" CARE_FRONTEND_URL="$CARE_FRONTEND_URL" CARE_SMOKE_CLINIC_SLUG="$CARE_SMOKE_CLINIC_SLUG" CARE_SMOKE_IDENTIFIER="$CARE_SMOKE_IDENTIFIER" CARE_SMOKE_PASSWORD="$CARE_SMOKE_PASSWORD" python scripts/smoke_care_api.py; then
          ssh "$EC2_USER@$EC2_HOST" "RELEASE_ROOT='$RELEASE_ROOT' RELEASE_SHA='${{ github.sha }}' bash -s" <<'ROLLBACK'
          set -euo pipefail
          previous=$(cat "$RELEASE_ROOT/$RELEASE_SHA/previous-container")
          test -n "$previous"
          docker rm -f teta2-web
          docker rename "$previous" teta2-web
          docker start teta2-web
          ROLLBACK
            exit 1
          fi
      - name: Verify responsive authenticated frontend
        env:
          CARE_E2E_URL: ${{ secrets.CARE_FRONTEND_URL || 'https://www.teta2.com' }}
          CARE_E2E_CLINIC: ${{ secrets.CARE_SMOKE_CLINIC_SLUG }}
          CARE_E2E_USER: ${{ secrets.CARE_SMOKE_IDENTIFIER }}
          CARE_E2E_PASSWORD: ${{ secrets.CARE_SMOKE_PASSWORD }}
        working-directory: frontend-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:responsive
      - name: Roll back after responsive verification failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '35.159.65.156' }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_ROOT: ${{ secrets.EC2_RELEASE_ROOT || '/tmp/dentai-releases' }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "RELEASE_ROOT='$RELEASE_ROOT' RELEASE_SHA='${{ github.sha }}' bash -s" <<'ROLLBACK'
          set -euo pipefail
          previous=$(cat "$RELEASE_ROOT/$RELEASE_SHA/previous-container")
          test -n "$previous"
          docker rm -f teta2-web
          docker rename "$previous" teta2-web
          docker start teta2-web
          ROLLBACK

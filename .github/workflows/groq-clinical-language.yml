name: Groq clinical language

on:
  pull_request:
    branches:
      - main
    paths:
      - "ai_engine/groq/**"
      - "app/ai/providers.py"
      - "app/core/config.py"
      - "tests/test_groq_provider.py"
      - ".github/workflows/groq-clinical-language.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check Groq provider formatting
        run: uv run ruff format --check ai_engine/groq/provider.py tests/test_groq_provider.py

      - name: Lint Groq provider
        run: uv run ruff check ai_engine/groq/provider.py tests/test_groq_provider.py

      - name: Run Groq clinical-language tests
        run: uv run pytest tests/test_groq_provider.py

name: WhatsApp outreach

on:
  pull_request:
    paths:
      - "whatsapp_service/**"
      - "app/outreach/**"
      - "app/database/models.py"
      - "app/core/config.py"
      - "app/ai/worker.py"
      - "app/main.py"
      - "migrations/versions/0004_whatsapp_outreach.py"
      - "frontend-test/**"
      - ".github/workflows/whatsapp-outreach.yml"
  push:
    branches: ["codex/baileys-whatsapp-outreach"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: >-
          uv run pytest
          tests/test_whatsapp_outreach.py
          tests/test_groq_provider.py
          tests/test_ai_provider_unresolved_fdi.py
      - run: uv run python -c "import app.main"
      - run: >-
          uv run ruff check
          app/outreach
          app/ai/worker.py
          app/core/config.py
          app/database/models.py
          app/main.py
          tests/test_whatsapp_outreach.py
          migrations/versions/0004_whatsapp_outreach.py
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: whatsapp_service
      - run: npm test
        working-directory: whatsapp_service
      - run: docker build -t dentai-whatsapp-test whatsapp_service
      - name: Smoke-test Node service health
        run: |
          docker run -d --rm --name dentai-whatsapp-smoke -e WHATSAPP_SERVICE_TOKEN=ci-test-token -p 3001:3001 dentai-whatsapp-test
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:3001/health; then
              docker stop dentai-whatsapp-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs dentai-whatsapp-smoke
          docker stop dentai-whatsapp-smoke
          exit 1
  frontend-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: frontend-test
      - run: npm test
        working-directory: frontend-test
      - run: npm run build
        working-directory: frontend-test
      - run: docker build -t dentai-integration-test .
